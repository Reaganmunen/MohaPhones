<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devices · mohaaa_gadgets</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/phosphor/duotone.css">
  <link rel="stylesheet" href="/vendor/phosphor/bold.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/pos.css">
  <link rel="stylesheet" href="/css/products.css">
  <link rel="stylesheet" href="/css/devices.css">
  <link rel="stylesheet" href="/css/imei-entry.css">
</head>
<body data-page="devices">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sb-scrim" id="sb-scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><i class="ph-duotone ph-list"></i></button>
      <div class="title"><h1>Devices</h1><div class="sub">IMEI register and warranty look-up</div></div>
      <div class="actions">
        <div class="dropdown">
          <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications">
            <i class="ph-duotone ph-bell"></i><span class="dot" id="notif-dot" hidden>0</span></button>
          <div class="dropdown-menu dropdown-menu-end notif-menu">
            <div class="notif-head"><b>Notifications</b><button type="button" id="notif-readall" hidden>Mark all as read</button></div>
            <div class="notif-list" id="notif-list"></div>
          </div>
        </div>
        <button class="btn-cta border-0" id="add-devices" type="button" data-perm="stock.adjust">
          <span class="txt">Add by IMEI</span><span class="plus"><i class="ph-bold ph-plus"></i></span>
        </button>
      </div>
    </header>

    <div class="card-hd">
      <div class="card-title-row"><h2>All devices</h2><span class="count-pill" id="d-count">0</span></div>
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-8"><div class="pos-search"><i class="ph-duotone ph-barcode"></i>
          <input id="d-q" class="form-control" type="search" placeholder="Scan / type IMEI, or search product, customer, phone, receipt…" autocomplete="off" autofocus></div></div>
        <div class="col-12 col-md-4"><select id="d-status" class="form-select dev-status">
          <option value="">All statuses</option><option value="in_stock">In stock</option><option value="sold">Sold</option>
          <option value="defective">Defective</option><option value="lost">Lost</option><option value="supplier_return">Returned to supplier</option></select></div>
      </div>
      <div class="table-responsive">
        <table class="table prod-table align-middle mb-0">
          <thead><tr><th>Device</th><th>IMEI / serial</th><th>Status</th><th class="d-none d-md-table-cell">Location</th><th>Sold to</th><th>Warranty</th></tr></thead>
          <tbody id="d-body"><tr><td colspan="6"><div class="state-box"><i class="ph-duotone ph-circle-notch"></i><div>Loading…</div></div></td></tr></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3" id="d-pager" hidden>
        <button class="btn btn-sm btn-light fw-bold" id="d-prev" type="button">&larr; Previous</button>
        <span class="small text-muted fw-semibold" id="d-page"></span>
        <button class="btn btn-sm btn-light fw-bold" id="d-next" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

<!-- add devices modal -->
<div class="modal fade" id="devModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content pay-modal">
    <div class="modal-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <h2 class="h5 fw-bold mb-0">Add phones to stock</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="hd-alert hd-alert-danger mb-3" id="a-err" hidden><i class="ph-duotone ph-warning-circle"></i><span></span></div>
      <div class="hd-alert hd-alert-success mb-3" id="a-ok" hidden><i class="ph-duotone ph-check-circle"></i><span></span></div>
      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-7"><label class="hd-label" for="a-product">Phone model</label>
          <select id="a-product" class="form-select"></select></div>
        <div class="col-12 col-sm-5"><label class="hd-label" for="a-loc">Location</label>
          <select id="a-loc" class="form-select"><option value="">Default shop</option></select></div>
      </div>
      <label class="hd-label">IMEI numbers</label>
      <div id="a-entry" class="mb-2"></div>
      <div class="small text-muted mb-3">Stock goes up by the number of phones scanned. For a supplier delivery with costs, use Purchases &rarr; Receive goods.</div>
      <button class="btn btn-hd btn-lg w-100" id="a-save" type="button"><span class="label">Add to stock</span></button>
    </div>
  </div></div>
</div>

<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/imei-entry.js"></script>
<script src="/js/devices.js"></script>
</body>
</html>
